<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- Защита: скрипты только свои и из telegram.org, никаких внешних картинок, запросов, форм и плагинов -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Ink Jump</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;background:#111;overflow:hidden;overscroll-behavior:none;
    touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:"Courier New",ui-monospace,monospace;font-weight:700;
  }
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;overflow:hidden;background:#fff;touch-action:none;font-size:16px}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- боковые подсказки (только широкий экран на ПК) ---------- */
  .side{display:none;width:250px;flex:none;color:#bbb;font-size:14px;line-height:1.55;padding:0 22px}
  .side h3{margin:0 0 .6em;color:#fff;font-size:15px;letter-spacing:.12em}
  .side p{margin:0 0 .9em}
  .key{
    display:inline-block;min-width:2em;padding:.05em .5em;margin:0 .25em .2em 0;text-align:center;
    border:2px solid #bbb;border-radius:.45em;color:#fff;
  }
  #wrap.wide .side{display:block}
  #wrap.wide #stage{outline:3px solid #fff;outline-offset:0}

  /* ---------- панели ---------- */
  .panel{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.75em;padding:1.5em;text-align:center;background:rgba(255,255,255,.9);color:#000;
  }
  .panel h1{margin:0 0 .3em;font-size:3em;line-height:.95;letter-spacing:.06em}
  .panel h2{margin:0;font-size:1.9em;letter-spacing:.06em}
  .stat{font-size:1.1em}
  .big{font-size:4em;line-height:1}
  .badge{background:#000;color:#fff;padding:.25em .8em;border-radius:.6em;font-size:1em}
  .small{font-size:.85em;opacity:.7;margin:0}

  .btn{
    font:inherit;font-size:1.25em;padding:.7em 1.6em;min-width:11em;
    border:3px solid #000;border-radius:.8em;background:#fff;color:#000;
    box-shadow:4px 4px 0 #000;cursor:pointer;
  }
  .btn.primary{background:#000;color:#fff}
  .btn.light{font-size:.95em;padding:.5em 1.2em;min-width:0}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
  .btn:hover{filter:invert(.08)}

  .iconbtn{
    position:absolute;top:.6em;right:.6em;width:2.6em;height:2.6em;z-index:2;
    border:3px solid #000;border-radius:.7em;background:#fff;color:#000;font:inherit;font-size:1em;cursor:pointer;
  }
  .hidden{display:none !important}

  /* ---------- магазин скинов ---------- */
  .shop{justify-content:flex-start;gap:.5em;padding-top:1.1em;padding-bottom:1em}
  .shop h2{margin-bottom:.1em}
  #shopMsg{min-height:1.2em;opacity:1;font-size:.9em}
  .grid{
    flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
    display:grid;grid-template-columns:1fr 1fr;gap:.8em;padding:.2em .4em .8em;align-content:start;
  }
  .card{
    border:3px solid #000;border-radius:.8em;background:#fff;color:#000;padding:.5em;
    display:flex;flex-direction:column;align-items:center;gap:.35em;box-shadow:3px 3px 0 #000;
  }
  .card.on{background:#000;color:#fff}
  .card canvas{width:5em;height:5.5em;border:2px solid #000;border-radius:.5em;background:#fff}
  .card .nm{font-size:1em}
  .cbtn{
    font:inherit;font-size:.9em;width:100%;padding:.4em .6em;cursor:pointer;
    border:2px solid currentColor;border-radius:.6em;background:#fff;color:#000;
  }
  .cbtn.buy{background:#000;color:#fff;border-color:#000}
  .cbtn.dim{opacity:.4}
  .cbtn.eq{background:transparent;color:#fff;border-color:#fff;cursor:default}
  .cbtn:not(.eq):active{transform:translate(1px,1px)}
</style>
</head>
<body>
<div id="wrap">
  <aside class="side" id="sideL">
    <h3 data-i18n="ctlTitle"></h3>
    <p><span class="key">A</span><span class="key">D</span> <span class="key">←</span><span class="key">→</span><br><span data-i18n="ctlMove"></span></p>
    <p><span data-i18n="ctlMouse"></span></p>
    <p><span class="key">P</span><span class="key">Esc</span><br><span data-i18n="ctlPause"></span></p>
    <p><span class="key">F</span> <span data-i18n="ctlFull"></span></p>
    <p><span class="key">Space</span> <span data-i18n="ctlStart"></span></p>
  </aside>

  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="btnPause" class="iconbtn hidden" aria-label="pause">II</button>

    <section id="menu" class="panel">
      <h1>INK<br>JUMP</h1>
      <div class="stat"><span data-i18n="best"></span>: <span id="menuBest">0</span></div>
      <div class="stat"><span data-i18n="coins"></span>: <span id="menuCoins">0</span></div>
      <button id="btnPlay" class="btn primary" data-i18n="play"></button>
      <button id="btnShop" class="btn" data-i18n="shopBtn"></button>
      <button id="btnSound" class="btn light"></button>
      <button id="btnFull" class="btn light hidden" data-i18n="full"></button>
      <p class="small" id="hint"></p>
      <p class="small" id="cloudNote"></p>
    </section>

    <section id="over" class="panel hidden">
      <h2 data-i18n="over"></h2>
      <div class="big" id="overScore">0</div>
      <div id="overNew" class="badge hidden" data-i18n="newRec"></div>
      <div class="stat"><span data-i18n="best"></span>: <span id="overBest">0</span></div>
      <div class="stat"><span data-i18n="runCoins"></span>: <span id="overCoins">0</span></div>
      <button id="btnAgain" class="btn primary" data-i18n="again"></button>
      <button id="btnShop2" class="btn" data-i18n="shopBtn"></button>
      <button id="btnMenu" class="btn light" data-i18n="menu"></button>
    </section>

    <section id="pause" class="panel hidden">
      <h2 data-i18n="pauseT"></h2>
      <button id="btnResume" class="btn primary" data-i18n="resume"></button>
      <button id="btnMenu2" class="btn" data-i18n="menu"></button>
    </section>

    <section id="shop" class="panel shop hidden">
      <h2 data-i18n="shopT"></h2>
      <div class="stat">● <span id="shopCoins">0</span></div>
      <div id="shopMsg"></div>
      <div id="shopGrid" class="grid"></div>
      <button id="btnShopBack" class="btn light" data-i18n="back"></button>
    </section>
  </div>

  <aside class="side" id="sideR">
    <h3 data-i18n="buffTitle"></h3>
    <p data-i18n="tipSpring"></p>
    <p data-i18n="tipBoots"></p>
    <p data-i18n="tipShield"></p>
    <p data-i18n="tipRocket"></p>
    <p data-i18n="tipStomp"></p>
    <p data-i18n="tipCoin"></p>
  </aside>
</div>
<script src="game.js"></script>
</body>
</html>
